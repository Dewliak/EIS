services:
  eu-data-compass:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_PATH: /data/eis.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EUDI_API_URL: ${EUDI_API_URL:-http://localhost:8080}
      ALLOWED_NATIONALITIES: ${ALLOWED_NATIONALITIES:-PT,DE,FR,NL,IT,ES,SK}
    volumes:
      - eu-data-compass-data:/data

volumes:
  eu-data-compass-data:
